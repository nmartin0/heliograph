[project]
name = "heliograph"
version = "0.1.0.dev0"
description = "A plug-in based trading-signal engine with backtesting, paper trading and a graphical workspace."
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "Nicholas Martin" }]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "ccxt>=4.5,<5",
    "msgspec>=0.19,<1",
    "pyarrow>=22,<27",
    "pydantic>=2.11,<3",
]

[dependency-groups]
dev = [
    "coverage>=7.16",
    "hypothesis>=6.140",
    "import-linter>=2.15",
    "mutmut>=3.8",
    "mypy>=1.18",
    "pyarrow-stubs>=20.0.0.20260819",
    "pytest>=8.4",
    "pytest-randomly>=5.0",
    "ruff>=0.14",
]

[project.entry-points."heliograph.journals"]
sqlite = "heliograph.plugins.sqlite_journal:SqliteJournal"

[project.entry-points."heliograph.data_sources"]
file = "heliograph.plugins.file_source:FileSource"
ccxt = "heliograph.plugins.ccxt_source:CcxtSource"
store = "heliograph.plugins.store:StoreSource"

[project.entry-points."heliograph.instrument_providers"]
static = "heliograph.plugins.static_instruments:StaticInstruments"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heliograph"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "PIE",      # misc lints
    "RET",      # return statements
    "PT",       # pytest style
    "N",        # naming
    "DTZ",      # timezone-aware datetimes only
    "RUF",      # ruff-specific
    "TID",      # banned APIs
]

[tool.ruff.lint.isort]
# Ours, sorted together after third-party imports.
known-first-party = ["heliograph", "scripts", "tests"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time.time".msg = "Read the time from a Clock (heliograph.core.clock)."
"time.time_ns".msg = "Read the time from a Clock (heliograph.core.clock)."
"datetime.datetime.now".msg = "Read the time from a Clock (heliograph.core.clock)."
"datetime.datetime.utcnow".msg = "Read the time from a Clock (heliograph.core.clock)."
"datetime.datetime.today".msg = "Read the time from a Clock (heliograph.core.clock)."
"datetime.date.today".msg = "Read the time from a Clock (heliograph.core.clock)."

[tool.ruff.lint.per-file-ignores]
# The wall clock is the one place allowed to read the system time.
"src/heliograph/core/clock.py" = ["TID251"]
# Embeds a bash script whose lines are kept whole for readability.
"scripts/make_apply_script.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]
# Module names from the source roots, so tests import shared builders as `tests.support`.
mypy_path = ["src", "."]
explicit_package_bases = true
warn_unreachable = true

[[tool.mypy.overrides]]
# CCXT ships no type information; its objects are Any to mypy.
module = ["ccxt", "ccxt.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# The repository root, so tests import shared builders as `tests.support`.
pythonpath = ["."]
# Live tests talk to real services; they run only when asked: -m live.
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not live"]
markers = ["live: talks to a real exchange; run on request with -m live"]
xfail_strict = true
filterwarnings = [
    "error",
    # CCXT asks aiohttp for a work-around Python 3.13 no longer needs; harmless.
    "ignore:enable_cleanup_closed ignored:DeprecationWarning",
]

[tool.importlinter]
root_package = "heliograph"

[[tool.importlinter.contracts]]
name = "Dependencies point inward: app -> plugins -> core"
type = "layers"
layers = ["heliograph.app", "heliograph.plugins", "heliograph.core"]

[tool.heliograph.licences]
# Read by scripts/licence_report.py; the policy is docs/licensing.md.

[tool.heliograph.licences.overrides]
# Package = "SPDX expression", where its metadata is wrong or empty.
# multidict 6.9: metadata says "Apache License 2.0", not an SPDX identifier.
multidict = "Apache-2.0"
# winloop: Windows only, so not installed here to read; PyPI's metadata for
# 0.6.3 states the MIT License.
winloop = "MIT"

[tool.heliograph.licences.exceptions]
# Package = "reason", for a denied licence accepted case by case.

[tool.heliograph.licences.projects]
# Package = "URL", where its metadata has no useful project link.
pydantic-core = "https://github.com/pydantic/pydantic-core"
typing-extensions = "https://github.com/python/typing_extensions"
winloop = "https://github.com/Vizonex/Winloop"

[tool.heliograph.coverage]
# Branch coverage each source file must reach; scripts/coverage_floor.py.
floor = 90

[tool.coverage.run]
branch = true
source_pkgs = ["heliograph"]

[tool.coverage.report]
show_missing = true
skip_covered = true
