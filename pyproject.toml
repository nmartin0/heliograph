[project]
name = "heliograph"
version = "0.1.0.dev0"
description = "A plug-in based trading-signal engine with backtesting, paper trading and a graphical workspace."
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "Nicholas Martin" }]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.11,<3",
]

[dependency-groups]
dev = [
    "hypothesis>=6.140",
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heliograph"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "PIE",      # misc lints
    "RET",      # return statements
    "PT",       # pytest style
    "N",        # naming
    "DTZ",      # timezone-aware datetimes only
    "RUF",      # ruff-specific
    "TID",      # banned APIs
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time.time".msg = "Read the time from a Clock (heliograph.core.clock)."
"time.time_ns".msg = "Read the time from a Clock (heliograph.core.clock)."
"datetime.datetime.now".msg = "Read the time from a Clock (heliograph.core.clock)."
"datetime.datetime.utcnow".msg = "Read the time from a Clock (heliograph.core.clock)."
"datetime.datetime.today".msg = "Read the time from a Clock (heliograph.core.clock)."
"datetime.date.today".msg = "Read the time from a Clock (heliograph.core.clock)."

[tool.ruff.lint.per-file-ignores]
# The wall clock is the one place allowed to read the system time.
"src/heliograph/core/clock.py" = ["TID251"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
