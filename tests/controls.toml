# Declared negative controls: each breaks one guarantee on purpose, and the
# tests named must then fail. scripts/check_controls.py applies each break,
# runs those tests, expects every one of them to fail, and restores the file.
# A control whose tests still pass is the finding: either the break is not
# the break it claims, or the tests do not check what they appear to.
#
#   describes  the guarantee, in its own words
#   path       the file to break, from the repository root
#   old        text that must occur exactly once in that file
#   new        what replaces it
#   tests      pytest node ids that must each fail
#
# Add a control when a test that guards a rule is written (docs/testing.md).

[[control]]
describes = "the bus refuses a message stamped after the clock"
path = "src/heliograph/core/bus.py"
